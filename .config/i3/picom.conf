#################################
#   Picom Config – Custom       #
#################################

backend = "glx";
vsync = true;
use-damage = true;

#################################
#   Shadows                     #
#################################

shadow = true;
shadow-radius = 20;
shadow-opacity = 0.85;
shadow-offset-x = -20;
shadow-offset-y = -20;
shadow-color = "#000000";

# Exclude certain apps from shadows
shadow-exclude = [
    "class_g = 'Steam'",
    "class_g = 'steamwebhelper'",
    "class_g = 'firefox'"
];

#################################
#   Fading                      #
#################################

fading = false;

#################################
#   Opacity                     #
#################################

inactive-opacity = 1.0;
active-opacity   = 1.0;
frame-opacity    = 1.0;
inactive-opacity-override = false;

#################################
#   Blur (optional)             #
#################################

blur: {
    method = "dual_kawase";
    strength = 5.0;
    deviation = 1.0;
    kernel = "11x11gaussian";
}

blur-background = false;

#################################
#   Window types                #
#################################

wintypes: {
    dock          = { shadow = false; };
    dnd           = { shadow = false; };
    tooltip       = { shadow = false; };
    notification  = { shadow = false; };
};
